<style>
  :root { --mc:#2563eb; --txt:#2f3437; --sub:#6b7280; --cell:#eef2f8; --line:#e3e8ef;
          --ok:#1a9a46; --okbg:#e5f5ea; --warn:#d97706; --warnbg:#fff1dc; --err:#d6204e; --errbg:#fdeaf0;
          --head:48px; /* Platz für die Kopfzeile, die Symcon über jede Kachel legt */ }
  body { margin:0; font-family: Poppins, 'Segoe UI', system-ui, sans-serif; color:var(--txt); }
  button, input, select { font-family:inherit; }
  .wrap { display:flex; flex-direction:column; align-items:center; gap:10px; height:100%; box-sizing:border-box; padding:var(--head) 16px 14px; overflow-y:auto; }
  .top { width:100%; display:flex; align-items:center; justify-content:flex-end; gap:6px; }
  .btn { border:none; border-radius:50%; width:36px; height:36px; background:var(--cell); color:var(--txt); font-size:16px; cursor:pointer; flex:none; }
  .pw.on { background:var(--mc); color:#fff; }
  .lk.locked { background:var(--errbg); color:var(--err); }
  .chips { width:100%; display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:none; border-radius:999px; padding:4px 12px; font-size:13px; font-weight:500; background:var(--cell); color:var(--sub); }
  .chip.ok { background:var(--okbg); color:var(--ok); }
  .chip.ok::before { content:'\25CF\00a0'; font-size:9px; vertical-align:2px; }
  .chip.warn { background:var(--warnbg); color:var(--warn); cursor:pointer; }
  .chip.err { background:var(--errbg); color:var(--err); cursor:pointer; }
  .dial { position:relative; width:min(78vw, 52vh); max-width:240px; aspect-ratio:1; touch-action:none; }
  svg { width:100%; height:100%; }
  #bg { stroke:var(--line); }
  #fg { stroke:var(--mc); transition:stroke .3s; }
  #knob { fill:#fff; stroke:var(--mc); stroke-width:3; }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .soll { font-size:46px; font-weight:700; letter-spacing:-1px; line-height:1.1; }
  .soll .u { font-size:18px; font-weight:500; margin-left:3px; letter-spacing:0; }
  .ist { font-size:14px; color:var(--sub); }
  .mlabel { font-size:13px; color:var(--mc); margin-top:3px; font-weight:600; }
  .off .soll, .off #fg, .off #knob { opacity:.35; }
  .pm { display:flex; gap:60px; margin-top:-14px; }
  .seg-wrap { width:100%; }
  .seg-l { font-size:13px; color:var(--sub); margin:0 0 4px 2px; }
  .seg { display:flex; background:var(--cell); border-radius:12px; padding:4px; gap:4px; }
  .seg button { flex:1; border:none; border-radius:9px; padding:7px 2px; background:none; color:var(--txt); font-size:13px; cursor:pointer; }
  .seg button.act { background:var(--mc); color:#fff; font-weight:500; }
  .ico { font-size:16px; display:block; }
  .pop { position:fixed; inset:0; background:rgba(30,40,55,.35); display:none; align-items:center; justify-content:center; z-index:10; }
  .pop.show { display:flex; }
  .box { background:#fff; color:var(--txt); border-radius:16px; padding:18px; width:92%; max-width:440px; max-height:85%; overflow-y:auto; box-sizing:border-box; box-shadow:0 10px 30px rgba(0,0,0,.15); }
  .box h3 { margin:0 0 10px; font-size:18px; font-weight:500; }
  .ir { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .ir span:first-child { color:var(--sub); }
  .ir span:last-child { font-weight:600; text-align:right; }
  .red { color:var(--err) !important; } .yel { color:var(--warn) !important; }
  .t { background:var(--cell); border-radius:12px; padding:10px; margin-bottom:8px; display:flex; flex-direction:column; gap:8px; }
  .rowx { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .t .rowx { margin-top:0; }
  .end { justify-content:flex-end; }
  .day { width:30px; height:30px; border-radius:50%; border:none; background:#fff; color:var(--sub); font-size:11px; cursor:pointer; }
  .day.sel { background:var(--mc); color:#fff; }
  input, select { background:#fff; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:5px; }
  .act-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); border-radius:10px;
             padding:9px 14px; cursor:pointer; background:#fff; color:var(--txt); font-weight:500; font-size:14px;
             transition:background .15s, color .15s, border-color .15s, transform .08s; }
  .act-btn:hover { background:var(--cell); }
  .act-btn:active { transform:scale(.96); background:#dfe6f0; }
  .act-btn.primary { background:var(--mc); border-color:var(--mc); color:#fff; }
  .act-btn.busy { cursor:wait; color:var(--sub); background:var(--cell); }
  .act-btn.done { background:var(--okbg); border-color:var(--okbg); color:var(--ok); }
  .act-btn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .spin { width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .acts .act-btn { width:100%; }
  .ghost { background:var(--cell); color:var(--txt); }
  .del { background:var(--errbg); color:var(--err); }
  .btn { display:inline-flex; align-items:center; justify-content:center; }
  .btn svg, .ico svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .ico { display:flex; justify-content:center; margin-bottom:2px; }
  .box.wide { max-width:560px; }
  .chead { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .chead h3 { margin:0; }
  .cseg { flex:none; }
  .cseg button { padding:5px 12px; white-space:nowrap; }
  .cbody { min-height:230px; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:14px; text-align:center; }
  .cbody svg { width:100%; height:auto; }
  .gl { stroke:var(--line); stroke-width:1; }
  .ax { fill:var(--sub); font-size:12px; font-family:inherit; }
  .clegend { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--sub); margin-top:6px; }
  .clegend .li { cursor:pointer; user-select:none; }
  .clegend .li.off { opacity:.35; text-decoration:line-through; }
  .clegend i { display:inline-block; width:16px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle; }
</style>

<div class="wrap" id="wrap">
  <div class="top">
    <button class="btn" id="tbtn" title="Zeitschaltuhr"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
    <button class="btn" id="ibtn" title="Status"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg></button>
    <button class="btn" id="cbtn" title="Verlauf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16"/><path d="M7 15l4-5 3 3 5-6"/></svg></button>
    <button class="btn lk" id="lk" title="Fernbedienung"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg></button>
    <button class="btn pw" id="pw" title="Ein/Aus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M7 6.3a7 7 0 1 0 10 0"/></svg></button>
  </div>

  <div class="seg-wrap" id="modesW"><div class="seg-l">Betriebsart</div><div class="seg" id="modes"></div></div>
  <div class="seg-wrap" id="fansW"><div class="seg-l">Lüfter</div><div class="seg" id="fans"></div></div>

</div>

  <div class="box">

<script>
  const ICON = {"lock": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"/></svg>", "unlock": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V7a4 4 0 0 1 7.5-2\"/></svg>", "power": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3v8\"/><path d=\"M7 6.3a7 7 0 1 0 10 0\"/></svg>", "sun": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/></svg>", "snow": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 2v20M4.9 7l14.2 10M4.9 17L19.1 7\"/><path d=\"M9 4l3 2 3-2M9 20l3-2 3 2\"/></svg>", "fan": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"1.5\"/><path d=\"M12 10.5c0-4 1-7 4-7s3 4-1.5 6.5M13.5 12c4 0 7 1 7 4s-4 3-6.5-1.5M12 13.5c0 4-1 7-4 7s-3-4 1.5-6.5M10.5 12c-4 0-7-1-7-4s4-3 6.5 1.5\"/></svg>", "drop": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z\"/></svg>", "auto": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 12a8 8 0 1 1-2.3-5.6\"/><path d=\"M20 4v4h-4\"/></svg>"};
  const CX = 100, CY = 100, R = 80, START = 135, SWEEP = 270;
  const DAYS = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const MODES = {
    auto: [ICON.auto, 'Auto', '#7c3aed'],
    heat: [ICON.sun, 'Heizen', '#e5534b'],
    cool: [ICON.snow, 'Kühlen', '#2563eb'],
    fan:  [ICON.fan, 'Nur Lüfter', '#0f9f8a'],
    dry:  [ICON.drop, 'Trocknen', '#d97706']
  };
  const FANS = ['Niedrig', 'Mittel', 'Hoch', 'Power'];
  let s = { has: {} }, dragVal = null, edit = [];
  const $ = id => document.getElementById(id);
  const esc = x => String(x).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const fmt = v => v === null || v === undefined ? '--' : Number(v).toFixed(1).replace('.', ',');

  const pt = a => { const r = a * Math.PI / 180; return [CX + R * Math.cos(r), CY + R * Math.sin(r)]; };
  const arc = (a1, a2) => {
    const [x1, y1] = pt(a1), [x2, y2] = pt(a2);
    return `M ${x1} ${y1} A ${R} ${R} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${x2} ${y2}`;
  };
  $('bg').setAttribute('d', arc(START, START + SWEEP));

  // ---------- Warten auf die Rückmeldung vom KNX-Bus ----------
  // Ein angewählter Wert bleibt sichtbar, bis der Bus genau diesen Wert meldet
  // (höchstens HOLD ms). So springt die Anzeige nicht zwischen alt und neu.
  const HOLD = 10000;
  const pending = {};
  const unconfirmed = {};   // Befehle ohne Bestätigung vom Gerät
  const LABEL = { power: 'Ein/Aus', mode: 'Betriebsart', set: 'Solltemperatur', fan: 'Lüfter', vane: 'Lamellen', swing: 'Swing', lock: 'Sperre' };
  let real = { has: {} }, holdTimer = null;
  const same = (a, b) => (typeof a === 'number' && typeof b === 'number') ? Math.abs(a - b) < 0.05 : a === b;

  function hold(key, value) {
    pending[key] = { v: value, until: Date.now() + HOLD };
    s[key] = value;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { s = applyPending(real); render(); }, HOLD + 100);
  }

  function applyPending(state) {
    const st = JSON.parse(JSON.stringify(state));
    const now = Date.now();
    for (const k in pending) {
      const p = pending[k];
      if (same(state[k], p.v)) { delete pending[k]; delete unconfirmed[k]; continue; }   // bestätigt
      if (now > p.until) { unconfirmed[k] = { v: p.v, t: now }; delete pending[k]; continue; }   // keine Bestätigung
      else st[k] = p.v;                                                // noch unterwegs
    }
    return st;
  }

  function handleMessage(data) {
    const msg = typeof data === 'string' ? JSON.parse(data) : data;
    if (msg && msg.chart) { drawChart(msg.chart); return; }   // Antwort auf die Diagramm-Anfrage
    real = msg;
    real.has = real.has || {};
    for (const k in unconfirmed) if (same(real[k], unconfirmed[k].v)) delete unconfirmed[k];   // doch noch bestätigt
    s = applyPending(real);
    render();
    if ($('info').classList.contains('show')) renderInfo();
  }


  function render() {
    const m = MODES[s.mode];
    document.documentElement.style.setProperty('--mc', m ? m[2] : '#2563eb');
    $('pw').classList.toggle('on', !!s.power);
    const lk = $('lk');
    lk.style.display = s.has.lock ? '' : 'none';
    lk.classList.toggle('locked', !!s.lock);
    lk.innerHTML = s.lock ? ICON.lock : ICON.unlock;
    lk.title = s.lock ? 'Fernbedienung gesperrt, tippen zum Freigeben' : 'Fernbedienung frei, tippen zum Sperren';
    $('wrap').classList.toggle('off', !s.power || s.mode === 'fan');
    $('ist').textContent = 'Ist ' + fmt(s.act) + ' °C';
    $('mlabel').textContent = s.power ? (m ? m[1] : 'Ein') : 'Aus';
    drawDial(dragVal !== null ? dragVal : s.set);
    renderChips();

    seg('modes', s.has.mode,
      (s.modeList || ['heat', 'cool', 'fan']).map(k => ({ v: k, h: `<span class="ico">${MODES[k][0]}</span>${MODES[k][1]}`, a: s.mode === k })),
      v => { hold('mode', v); render(); requestAction('mode', v); });

    seg('fans', s.has.fan,
      FANS.map((t, i) => ({ v: i, h: t, a: s.fan === i })),
      v => { hold('fan', v); render(); requestAction('fan', v); });

    const vanes = s.has.vane ? [1,2,3,4].map(i => ({ v: i, h: 'Pos ' + i, a: !s.swing && s.vane === i })) : [];
    if (s.has.swing) vanes.push({ v: 'swing', h: 'Swing', a: !!s.swing });
    seg('vanes', vanes.length > 0, vanes, v => {
      if (v === 'swing') { hold('swing', !s.swing); render(); requestAction('swing', s.swing); return; }
      if (s.swing && s.has.swing) requestAction('swing', false);
      if (s.has.swing) hold('swing', false);
      hold('vane', v); render();
      requestAction('vane', v);
    });
  }

  function seg(id, show, items, cb) {
    $(id + 'W').style.display = show ? '' : 'none';
    if (!show) return;
    const el = $(id);
    el.innerHTML = '';
    items.forEach(it => {
      const b = document.createElement('button');
      b.innerHTML = it.h;
      if (it.a) b.className = 'act';
      b.onclick = () => cb(it.v);
      el.appendChild(b);
    });
  }

  function renderChips() {
    const c = $('chips');
    c.innerHTML = '';
    const add = (t, cls, fn) => {
      const b = document.createElement('button');
      b.className = 'chip ' + (cls || '');
      b.textContent = t;
      if (fn) b.onclick = fn;
      c.appendChild(b);
    };
    if (s.comm) add('⚠ Keine Verbindung', 'err', openInfo);
    if (s.err) add('⚠ ' + s.errText, 'err', openInfo);
    if (s.filter) add('Filter reinigen', 'warn', openInfo);
    const unc = Object.keys(unconfirmed).filter(k => Date.now() - unconfirmed[k].t < 120000).map(k => LABEL[k] || k);
    if (unc.length) add('Nicht bestätigt: ' + unc.join(', '), 'warn', openInfo);
    (s.noFeedback || []).forEach(n => add('Keine Rückmeldung: ' + n, 'warn', openInfo));
    if (s.has.lock && s.lock) add('Fernbedienung gesperrt · freigeben', 'warn', () => { hold('lock', false); render(); requestAction('lock', false); });
    if (s.power && s.comp === true) add('Verdichter läuft', 'ok');
    if (!s.comm && !s.err && !s.filter && !(s.has.lock && s.lock) && (s.comm !== null || s.errCode !== null)) { if (!unc.length && !(s.noFeedback || []).length) add('Alle Werte OK', 'ok'); }
  }

  function drawDial(v) {
    const val = v === null || v === undefined ? s.min : v;
    const f = Math.min(1, Math.max(0, (val - s.min) / (s.max - s.min)));
    const a = START + SWEEP * f;
    $('fg').setAttribute('d', f > 0.001 ? arc(START, a) : '');
    const [x, y] = pt(a);
    $('knob').setAttribute('cx', x);
    $('knob').setAttribute('cy', y);
    $('soll').innerHTML = fmt(v) + '<span class="u">°C</span>';
  }

  function snap(raw) {
    const v = Math.round(raw / s.step) * s.step;
    return +Math.min(s.max, Math.max(s.min, v)).toFixed(1);
  }

  function valFromEvent(e) {
    const r = $('dial').getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 200 - CX;
    const y = (e.clientY - r.top) / r.height * 200 - CY;
    let a = (Math.atan2(y, x) * 180 / Math.PI - START + 720) % 360;
    if (a > SWEEP) a = a > (SWEEP + 360) / 2 ? 0 : SWEEP;
    return snap(s.min + (s.max - s.min) * a / SWEEP);
  }

  const dial = $('dial');
  dial.addEventListener('pointerdown', e => { dial.setPointerCapture(e.pointerId); dragVal = valFromEvent(e); drawDial(dragVal); });
  dial.addEventListener('pointermove', e => { if (dragVal !== null) { dragVal = valFromEvent(e); drawDial(dragVal); } });
  dial.addEventListener('pointerup', () => {
    if (dragVal !== null) { hold('set', dragVal); requestAction('setpoint', dragVal); dragVal = null; render(); }
  });

  const stepSet = d => {
    const base = s.set === null || s.set === undefined ? s.min : s.set;
    const v = snap(base + d * s.step);
    hold('set', v); drawDial(v);
    requestAction('setpoint', v);
  };
  $('minus').onclick = () => stepSet(-1);
  $('plus').onclick = () => stepSet(1);
  $('pw').onclick = () => { const v = !s.power; hold('power', v); render(); requestAction('power', v); };
  $('lk').onclick = () => { const v = !s.lock; hold('lock', v); render(); requestAction('lock', v); };

  // ---------- Status-Fenster ----------
  function openInfo() { renderInfo(); $('info').classList.add('show'); }
  $('ibtn').onclick = openInfo;
  $('iclose').onclick = () => $('info').classList.remove('show');

  function renderInfo() {
    const r = (k, v, cls) => `<div class="ir"><span>${k}</span><span class="${cls || ''}">${v}</span></div>`;
    let h = '';
    if (s.comm !== null) h += r('Verbindung', s.comm ? 'Gestört' : 'OK', s.comm ? 'red' : '');
    if (s.errCode !== null) h += r('Störung', s.err ? esc(s.errText) : 'Keine', s.err ? 'red' : '');
    if (s.filter !== null) h += r('Filter', s.filter ? 'Reinigen' : 'OK', s.filter ? 'yel' : '');
    if (s.comp !== null) h += r('Verdichter', s.comp ? 'Ein' : 'Aus');
    if (s.thermo !== null) h += r('Thermo', s.thermo ? 'Ein' : 'Aus');
    if (s.lock !== null) h += r('Fernbedienung', s.lock ? 'Gesperrt' : 'Frei');
    if ((s.noFeedback || []).length) h += r('Keine Rückmeldung', s.noFeedback.map(esc).join('<br>'), 'yel');
    h += r('Ist-Temperatur', fmt(s.act) + ' °C');
    (s.diag || []).forEach(d => h += r(esc(d.n), esc(d.v)));
    $('ibody').innerHTML = h;

    const b = $('ibtns');
    b.innerHTML = '';
    const btn = (key, icon, t, fn, ok) => {
      const x = document.createElement('button');
      x.className = 'act-btn';
      decorate(x, key, PI[icon] + t);
      x.onclick = () => pressed(key, fn, ok);
      b.appendChild(x);
    };
    if (s.has.errReset) btn('errReset', 'reset', 'Störung zurücksetzen', () => requestAction('errReset', true), 'Zurückgesetzt');
    if (s.has.filterReset) btn('filterReset', 'filter', 'Filter zurücksetzen', () => requestAction('filterReset', true), 'Zurückgesetzt');
    if (s.lock !== null) btn('lock', s.lock ? 'unlock' : 'lock', s.lock ? 'Fernbedienung freigeben' : 'Fernbedienung sperren', () => { const v = !s.lock; hold('lock', v); render(); requestAction('lock', v); }, s.lock ? 'Freigegeben' : 'Gesperrt');
  }

  // ---------- Zeitschaltuhr ----------
  $('tbtn').onclick = () => {
    edit = JSON.parse(JSON.stringify(s.timers || []));
    renderTimers();
    $('pop').classList.add('show');
  };
  $('tcancel').onclick = () => $('pop').classList.remove('show');
  $('tadd').onclick = () => {
    edit.push({ enabled: true, time: '07:00', days: [1,2,3,4,5], action: 'on', temp: s.set || 22, mode: '', fan: -1 });
    renderTimers();
  };
  $('tsave').onclick = () => pressed('timers', () => {
    requestAction('timers', JSON.stringify(edit));
    setTimeout(() => $('pop').classList.remove('show'), 1500);   // nach der Bestätigung schließen
  }, 'Gespeichert');

  function renderTimers() {
    const l = $('tlist');
    l.innerHTML = edit.length ? '' : '<p style="opacity:.6">Noch keine Schaltzeiten.</p>';
    edit.forEach((t, i) => {
      const on = t.action === 'on';
      const modeOpts = '<option value="">Modus unverändert</option>' +
        (s.modeList || ['heat', 'cool', 'fan']).map(k => `<option value="${k}" ${t.mode === k ? 'selected' : ''}>${MODES[k][1]}</option>`).join('');
      const fanOpts = '<option value="-1">Lüfter unverändert</option>' +
        FANS.map((n, j) => `<option value="${j}" ${Number(t.fan) === j ? 'selected' : ''}>${n}</option>`).join('');
      const d = document.createElement('div');
      d.className = 't';
      d.innerHTML = `
        <div class="rowx">
          <input type="checkbox" ${t.enabled ? 'checked' : ''} data-k="enabled">
          <input type="time" value="${t.time}" data-k="time">
          <select data-k="action">
            <option value="on" ${on ? 'selected' : ''}>Ein</option>
            <option value="off" ${!on ? 'selected' : ''}>Aus</option>
          </select>
          <button class="act-btn del" data-del>✕</button>
        </div>
        ${on ? `<div class="rowx">
          <input type="number" step="${s.step}" min="${s.min}" max="${s.max}" value="${t.temp ?? ''}" data-k="temp" style="width:70px"> °C
          ${s.has.mode ? `<select data-k="mode">${modeOpts}</select>` : ''}
          ${s.has.fan ? `<select data-k="fan">${fanOpts}</select>` : ''}
        </div>` : ''}
        <div class="rowx">${DAYS.map((n, j) =>
          `<button class="day ${t.days.includes(j + 1) ? 'sel' : ''}" data-day="${j + 1}">${n}</button>`).join('')}</div>`;
      d.querySelectorAll('[data-k]').forEach(inp => inp.onchange = () => {
        const k = inp.dataset.k;
        if (inp.type === 'checkbox') t[k] = inp.checked;
        else if (k === 'temp') t[k] = parseFloat(inp.value);
        else if (k === 'fan') t[k] = parseInt(inp.value, 10);
        else t[k] = inp.value;
        if (k === 'action') renderTimers();
      });
      d.querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
        const n = Number(b.dataset.day);
        t.days = t.days.includes(n) ? t.days.filter(x => x !== n) : [...t.days, n];
        renderTimers();
      });
      d.querySelector('[data-del]').onclick = () => { edit.splice(i, 1); renderTimers(); };
      l.appendChild(d);
    });
  }

  // ---------- Diagramm ----------
  let chartHours = 24;
  $('cbtn').onclick = () => { $('chart').classList.add('show'); loadChart(chartHours); };
  $('cclose').onclick = () => $('chart').classList.remove('show');
  document.querySelectorAll('#crange button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#crange button').forEach(x => x.classList.toggle('act', x === b));
    loadChart(Number(b.dataset.h));
  });

  function loadChart(h) {
    chartHours = h;
    $('cbody').textContent = 'Lade …';
    $('clegend').innerHTML = '';
    requestAction('chart', h);
  }

  let lastChart = null;
  const hidden = new Set();

  function drawChart(c) {
    lastChart = c;
    const body = $('cbody'), leg = $('clegend');
    if (!c.archive) { body.textContent = 'Kein Archiv in Symcon gefunden.'; return; }
    const all = (c.series || []).filter(x => x.points && x.points.length);
    const series = all.filter(x => !hidden.has(x.name));
    if (!all.length) { body.textContent = 'Noch keine aufgezeichneten Werte. Die Aufzeichnung läuft, der Verlauf füllt sich ab jetzt.'; return; }
    const W = 400, H = 230, L = 34, R = 8, T = 10, B = 26;
    let lo = Infinity, hi = -Infinity;
    (series.length ? series : all).forEach(sr => sr.points.forEach(p => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); }));
    lo = Math.floor(lo - 0.5); hi = Math.ceil(hi + 0.5);
    if (hi - lo < 4) { const m = (hi + lo) / 2; lo = Math.floor(m - 2); hi = Math.ceil(m + 2); }
    const x = t => L + (t - c.from) / (c.to - c.from) * (W - L - R);
    const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
    let g = '';
    for (let i = 0; i <= 4; i++) {
      const v = lo + (hi - lo) * i / 4;
      g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="gl"/>`
         + `<text x="${L - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${(Math.round(v * 10) / 10).toString().replace('.', ',')}</text>`;
    }
    const ticks = c.hours <= 48 ? 4 : (c.hours <= 200 ? 7 : 5);
    for (let i = 0; i <= ticks; i++) {
      const t = c.from + (c.to - c.from) * i / ticks, d = new Date(t * 1000);
      const lab = c.hours <= 48 ? d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
                                : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
      g += `<text x="${x(t)}" y="${H - 6}" class="ax" text-anchor="${i === 0 ? 'start' : i === ticks ? 'end' : 'middle'}">${lab}</text>`;
    }
    series.forEach(sr => {
      let d = '';
      sr.points.forEach((p, i) => {
        const X = x(Math.max(c.from, p[0])).toFixed(1), Y = y(p[1]).toFixed(1);
        d += i === 0 ? `M${X} ${Y}` : (sr.step ? `H${X}V${Y}` : `L${X} ${Y}`);
      });
      g += `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round" ${sr.dash ? 'stroke-dasharray="5 4"' : (sr.dot ? 'stroke-dasharray="1.5 4" stroke-linecap="round"' : '')}/>`;
    });
    body.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
    leg.innerHTML = all.map((sr, i) => `<span class="li ${hidden.has(sr.name) ? 'off' : ''}" data-i="${i}">`
      + `<i style="background:${sr.dash || sr.dot ? 'repeating-linear-gradient(90deg,' + sr.color + ' 0 4px,transparent 4px 7px)' : sr.color}"></i>${esc(sr.name)}</span>`).join('');
    leg.querySelectorAll('.li').forEach(el => el.onclick = () => {
      const n = all[Number(el.dataset.i)].name;
      hidden.has(n) ? hidden.delete(n) : hidden.add(n);
      drawChart(lastChart);
    });
  }

  // ---------- Tasten mit Rückmeldung ----------
  // Zustand je Taste bleibt erhalten, auch wenn das Fenster neu gezeichnet wird
  const PI = {"sync": "<svg viewBox=\"0 0 24 24\"><path d=\"M20 12a8 8 0 0 1-14.3 4.9\"/><path d=\"M4 12a8 8 0 0 1 14.3-4.9\"/><path d=\"M18 3v4h-4M6 21v-4h4\"/></svg>", "reset": "<svg viewBox=\"0 0 24 24\"><path d=\"M4 12a8 8 0 1 0 2.3-5.7\"/><path d=\"M4 4v4h4\"/></svg>", "filter": "<svg viewBox=\"0 0 24 24\"><path d=\"M4 5h16l-6 7v6l-4 2v-8z\"/></svg>", "lock": "<svg viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"/></svg>", "unlock": "<svg viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V7a4 4 0 0 1 7.5-2\"/></svg>", "check": "<svg viewBox=\"0 0 24 24\"><path d=\"M5 12l5 5 9-10\"/></svg>"};
  const press = {};
  function pressed(key, run, okText) {
    if (press[key]) return;                                   // läuft schon
    press[key] = { st: 'busy' };
    refreshButtons();
    run();
    setTimeout(() => {
      press[key] = { st: 'done', ok: okText || 'Gesendet' };
      refreshButtons();
      setTimeout(() => { delete press[key]; refreshButtons(); }, 1800);
    }, 700);
  }
  function decorate(el, key, html) {
    const p = press[key];
    el.classList.toggle('busy', !!p && p.st === 'busy');
    el.classList.toggle('done', !!p && p.st === 'done');
    el.innerHTML = !p ? html : (p.st === 'busy' ? '<span class="spin"></span>Wird gesendet …' : PI.check + p.ok);
  }
  function refreshButtons() {
    if ($('info').classList.contains('show')) renderInfo();
    const sv = $('tsave');
    if (sv) decorate(sv, 'timers', 'Speichern');
  }
</script>
