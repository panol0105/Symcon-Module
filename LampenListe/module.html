<style>
  :root { --mc:#2563eb; --txt:#2f3437; --sub:#6b7280; --cell:#eef2f8; --line:#e3e8ef;
          --ok:#1a9a46; --okbg:#e5f5ea; --warn:#d97706; --warnbg:#fff1dc; --err:#d6204e; --errbg:#fdeaf0;
          --head:48px; /* Platz für die Kopfzeile, die Symcon über jede Kachel legt */ }
  body { margin:0; font-family: Poppins, 'Segoe UI', system-ui, sans-serif; color:var(--txt); }
  button, input, select { font-family:inherit; }
  .list { display:flex; flex-direction:column; gap:8px; padding:var(--head) 14px 12px; overflow-y:auto; height:100%; box-sizing:border-box; }
  .row { background:var(--cell); border-radius:12px; padding:11px 14px; }
  .head { display:flex; align-items:center; gap:12px; cursor:pointer; }
  .dot { width:12px; height:12px; border-radius:50%; background:#cdd5e0; flex:none; }
  .on .dot { background:var(--lc, #f5b301); box-shadow:0 0 0 4px rgba(245,179,1,.18); }
  .name { flex:1; font-size:15px; font-weight:500; }
  .val { color:var(--sub); font-size:13px; min-width:42px; text-align:right; }
  .on .val { color:var(--txt); font-weight:600; }
  .tgl { width:44px; height:24px; border-radius:12px; background:#cdd5e0; position:relative; flex:none; transition:.2s; }
  .tgl::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .on .tgl { background:var(--ok); }
  .on .tgl::after { left:23px; }
  .det { display:none; padding-top:10px; }
  .open .det { display:block; }
  input[type=range] { width:100%; margin:6px 0; accent-color:var(--mc); }
  .temp { background:linear-gradient(90deg,#ffb35c,#fff,#bcd8ff); border-radius:6px; }
  input[type=color] { width:100%; height:32px; border:none; background:none; }
</style>
<div class="list" id="list"></div>
<script>
  const open = new Set();
  let lamps = [];

  function handleMessage(data) {
    lamps = typeof data === 'string' ? JSON.parse(data) : data;
    render();
  }

  function render() {
    const list = document.getElementById('list');
    // Während ein Slider gezogen wird, nicht neu rendern
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    list.innerHTML = '';
    lamps.forEach(l => {
      const r = document.createElement('div');
      r.className = 'row' + (l.on ? ' on' : '') + (open.has(l.i) ? ' open' : '');
      if (l.color) r.style.setProperty('--lc', l.color);
      const val = l.dim !== undefined ? (l.on ? l.dim + '%' : 'Aus') : (l.on ? 'An' : 'Aus');
      r.innerHTML = `<div class="head"><div class="dot"></div><div class="name">${l.name}</div><div class="val">${val}</div><div class="tgl"></div></div><div class="det"></div>`;
      r.querySelector('.tgl').onclick = e => { e.stopPropagation(); requestAction('switch_' + l.i, !l.on); };
      if (l.type !== 'switch') {
        r.querySelector('.head').onclick = () => { open.has(l.i) ? open.delete(l.i) : open.add(l.i); render(); };
        const det = r.querySelector('.det');
        det.appendChild(slider(0, 100, l.dim, v => requestAction('dim_' + l.i, v)));
        if (l.temp !== undefined) {
          const s = slider(l.tmin, l.tmax, l.temp, v => requestAction('temp_' + l.i, v));
          s.classList.add('temp');
          det.appendChild(s);
        }
        if (l.color) {
          const c = document.createElement('input');
          c.type = 'color'; c.value = l.color;
          c.onchange = () => { requestAction('color_' + l.i, c.value); c.blur(); };
          det.appendChild(c);
        }
      }
      list.appendChild(r);
    });
  }

  function slider(min, max, val, cb) {
    const s = document.createElement('input');
    s.type = 'range'; s.min = min; s.max = max; s.value = val;
    s.onchange = () => { cb(Number(s.value)); s.blur(); };
    return s;
  }
</script>
